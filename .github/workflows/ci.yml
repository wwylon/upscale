# GitHub Actions CI disabled — do not use automatic Actions minutes.
# Local / publish verify is the gate (publish.manifest.yaml verify + local pytest).
# Manual workflow_dispatch kept only if someone explicitly wants to resume later.

name: ci

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,mcp]"
      - name: Ruff
        run: ruff check upscaler tests
      - name: Mypy (schema + job_prep)
        run: mypy --follow-imports=silent upscaler/schema.py upscaler/job_prep.py
      - name: CLI help
        run: upscale --help && upscale models list
      - name: Pytest
        run: pytest
      - name: CPU smoke
        run: python scripts/cpu_smoke.py
      - name: UI bridge present
        run: |
          test -f ui/backend-bridge.js
          test -f ui/bridge/core.js
          grep -q backend-bridge.js ui/index.html
          grep -q 'bridge/core.js' ui/index.html
          grep -q backend-bridge.js ui/simple.html
          # Full design→ui sync is manual (scripts/sync_design_ui.py); remediations
          # live in ui/ and must not be overwritten blindly in CI.
