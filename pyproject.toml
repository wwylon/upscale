[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upscale"
version = "0.5.1"
description = "Local AI image upscaler: chained Real-ESRGAN passes to any scale, seam-free feather-blended tiles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "upscale" }]
keywords = ["image-upscaler", "super-resolution", "real-esrgan", "upscaling", "pytorch", "onnx", "mcp", "cli"]
dependencies = [
    "torch>=2.0",
    "torchvision",
    "spandrel",
    "Pillow",
    "tifffile",
    "imagecodecs",
    "psd-tools>=1.9",
    "tqdm",
    "click",
    "numpy",
    "pydantic>=2.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://wwylon.github.io/upscale/"
Repository = "https://github.com/wwylon/upscale"
Issues = "https://github.com/wwylon/upscale/issues"

[project.optional-dependencies]
ui = ["gradio>=4.0"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.0"]
desktop = ["pywebview>=5.0"]
# Adds ONNX Runtime + desktop deps for the Windows exe build. Does NOT remove torch (a core
# dependency); the shipped exe is built without it by desktop/build_windows_slim.ps1.
slim = [
    "upscale[server,desktop]",
    "onnxruntime>=1.17",
    "Pillow",
    "numpy",
    "tifffile",
    "imagecodecs",
    "tqdm",
    "click",
    "pydantic>=2.0",
]
dev = ["pytest>=7.0", "ruff>=0.4", "httpx>=0.27", "mypy>=1.8"]
# Classical resize prefers OpenCV (C++/SIMD); Pillow fallback always works
classical = ["opencv-python-headless>=4.8"]
# Raster→SVG→raster paper path (logos / line art). resvg_py = Windows-friendly SVG→PNG.
vectorize = ["vtracer>=0.6", "pyautotrace>=0.0.7", "resvg_py>=0.2"]
all = ["upscale[ui,server,mcp,desktop,slim,dev,classical,vectorize]"]

[project.scripts]
upscale = "upscale.cli:cli"

[tool.setuptools.packages.find]
include = ["upscale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Classic pyflakes + pycodestyle errors (keeps verify/CI stable across ruff minors)
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
    "E402",  # lazy/optional imports inside functions are intentional
    "E742",  # single-letter type names in generics (e.g. I for Image)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Gradio require these calls in parameter defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "gradio.Progress"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
pretty = true
